<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admisiones FAH 2026 - Octubre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --ucsg-blue: #003366;
            --ucsg-wine: #AE1049;
            --ucsg-light: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--ucsg-light);
        }
        .header-white {
            background-color: #ffffff;
            border-bottom: 2px solid #f1f5f9;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(174, 16, 73, 0.1);
            transition: all 0.3s ease;
        }
        .filter-btn.active {
            background-color: var(--ucsg-wine);
            color: white;
            border-color: var(--ucsg-wine);
        }
        @media print {
            .no-print { display: none !important; }
            .card-hover {
                box-shadow: none !important;
                transform: none !important;
                border: 1px solid #e2e8f0 !important;
                page-break-inside: avoid;
                margin-bottom: 2rem;
            }
            body { background: white; padding-bottom: 0; }
            main { padding: 0; width: 100%; }
            .grid { display: block !important; }
            .grid > div { width: 100%; margin-bottom: 30px; }
            header { padding-top: 0; margin-bottom: 20px; }
        }
    </style>
</head>
<body class="pb-20">

    <!-- Header Section -->
    <header class="header-white py-12 mb-10 text-center relative">
        <div class="container mx-auto px-4">

            <!-- Universidad Título -->
            <p class="text-base md:text-xl font-bold tracking-[0.2em] mb-4 uppercase" style="color: #AE1049;">Universidad Católica de Santiago de Guayaquil</p>

            <!-- Logo -->
            <img src="https://www.ucsg.edu.ec/wp-content/uploads/2024/03/logo-art.jpg" alt="Logo FAH" class="h-24 mx-auto mb-6 object-contain">

            <!-- Subtítulo -->
            <p class="text-xl md:text-2xl font-extrabold mb-2" style="color: #AE1049;">Calendario de actividades de admisión octubre 2026</p>
        </div>
    </header>

    <main class="container mx-auto px-4">

        <!-- Filters (No-print) -->
        <div class="no-print flex flex-wrap justify-center gap-2 mb-10" id="filters">
            <button onclick="filterBy('all', this)" class="filter-btn active px-5 py-2 rounded-full border border-gray-300 font-bold text-sm transition-all">Todos</button>
            <button onclick="filterBy('Animación', this)" class="filter-btn px-5 py-2 rounded-full border border-gray-300 font-bold text-sm transition-all">Animación</button>
            <button onclick="filterBy('Musicales', this)" class="filter-btn px-5 py-2 rounded-full border border-gray-300 font-bold text-sm transition-all">Música</button>
            <button onclick="filterBy('Cine', this)" class="filter-btn px-5 py-2 rounded-full border border-gray-300 font-bold text-sm transition-all">Cine</button>
            <button onclick="filterBy('PINE', this)" class="filter-btn px-5 py-2 rounded-full border border-gray-300 font-bold text-sm transition-all">PINE (Inglés)</button>
            <button onclick="filterBy('Videojuegos', this)" class="filter-btn px-5 py-2 rounded-full border border-gray-300 font-bold text-sm transition-all">Videojuegos</button>        </div>

        <!-- Activity Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="activity-grid">
            <!-- JavaScript injects content here -->
        </div>

    </main>

    <script>
        // Fuente: cronogramas de Admisión 2026 (sección OCTUBRE) — columnas FECHA, TEMA, LUGAR, DOCENTE RESPONSABLE/EXPOSITOR
        const activities = [
            {
                carrera: "Artes Musicales",
                titulo: "Concierto Didáctico Yaátalé",
                fecha: "Viernes 16 de Octubre",
                lugar: "Unidad Educativa Jefferson",
                docente: "Mgs. Alex Mora - Mgs. Lyzbeth Badaraco",
                img: "https://images.unsplash.com/photo-1514320291840-2e0a9bf2a9ae?auto=format&fit=crop&q=80&w=800",
                color: "#003366",
                instagram: "https://www.instagram.com/musicaucsg/"
            },
            {
                carrera: "Artes Musicales",
                titulo: "Primer Encuentro Infanto-Juvenil de Música de Cámara",
                fecha: "20 y 21 de Octubre",
                lugar: "Capilla Divina Sabiduría",
                docente: "Mgs. Alex Mora - Mgs. Isidro Mejía",
                img: "https://images.unsplash.com/photo-1465847899084-d164df4dedc6?auto=format&fit=crop&q=80&w=800",
                color: "#003366",
                instagram: "https://www.instagram.com/musicaucsg/"
            },
            {
                carrera: "PINE (Inglés)",
                titulo: "Intercolegial \"Forja de la Libertad\"",
                fecha: "Jueves 22 de Octubre",
                lugar: "Edificio principal - 2do piso. Leonidas Ortega",
                docente: "David Hoyos / Estudiantes de colegios",
                img: "https://images.unsplash.com/photo-1543269865-cbf427effbad?auto=format&fit=crop&q=80&w=800",
                color: "#8b5cf6",
                instagram: "https://www.instagram.com/pedagogiadelidiomainglesucsg/"
            },
            {
                carrera: "Arte y Videojuegos",
                titulo: "Webinar: La IA en Videojuegos Shooter",
                fecha: "Viernes 23 de Octubre",
                lugar: "Online - Webinar",
                docente: "Boris Sancan",
                img: "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&q=80&w=800",
                color: "#10b981",
                instagram: "https://www.instagram.com/carreradevideojuegosucsg/"
            },
            {
                carrera: "Animación Digital",
                titulo: "Taller: Diseño de Personajes Cartoon",
                fecha: "26 de Octubre al 12 de Noviembre",
                lugar: "Online - Taller",
                docente: "Jossie Lara Pintado",
                img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&q=80&w=800",
                color: "#AE1049",
                instagram: "https://www.instagram.com/animaciondigitalucsg/"
            },
            {
                carrera: "Cine",
                titulo: "Taller de composición audiovisual",
                fecha: "Miércoles 28 de Octubre",
                lugar: "FAH23",
                docente: "Canva Ma",
                img: "https://images.unsplash.com/photo-1478720568477-152d9b164e26?auto=format&fit=crop&q=80&w=800",
                color: "#000",
                instagram: "https://www.instagram.com/cineucsg/"
            },
            {
                carrera: "Artes Musicales",
                titulo: "Día del Rock",
                fecha: "Por confirmar",
                lugar: "Plaza Qatar",
                docente: "Mgs. Alex Mora - Mgs. Gustavo Vargas",
                img: "https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&q=80&w=800",
                color: "#003366",
                instagram: "https://www.instagram.com/musicaucsg/"
            }
        ];

        function shareWhatsApp(index) {
            const act = activities[index];
            const telefonoCoord = "593981510263";
            const mensaje = `¡Hola! Me gustaría recibir información sobre esta actividad de la Facultad de Artes y Humanidades de la UCSG:\n\n📌 *${act.titulo}*\n🎓 Carrera: ${act.carrera}\n📅 Fecha: ${act.fecha}\n\nQuedo atento/a a su respuesta.`;

            const url = `https://api.whatsapp.com/send?phone=${telefonoCoord}&text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        function renderActivities(filter = 'all') {
            const grid = document.getElementById('activity-grid');
            grid.innerHTML = '';

            const filtered = activities
                .map((act, index) => ({ ...act, index }))
                .filter(a => filter === 'all' || a.carrera.toLowerCase().includes(filter.toLowerCase()));

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 text-slate-400">
                        <i class="far fa-calendar-times text-4xl mb-4" style="color: #AE1049;"></i>
                        <p class="font-bold text-slate-600">No hay actividades programadas para esta carrera en octubre.</p>
                    </div>`;
                return;
            }

            filtered.forEach(act => {
                const card = `
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 card-hover flex flex-col overflow-hidden h-full">
                        <div class="h-48 relative overflow-hidden">
                            <img src="${act.img}" alt="${act.titulo.replace(/"/g, '&quot;')}" class="w-full h-full object-cover">
                            <div class="absolute top-3 left-3">
                                <span class="bg-white/95 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider shadow-sm" style="color: ${act.color}">
                                    ${act.carrera}
                                </span>
                            </div>
                        </div>
                        <div class="p-6 flex-grow">
                            <h3 class="text-xl font-extrabold text-slate-800 mb-4 leading-tight">${act.titulo}</h3>

                            <div class="space-y-2 mb-6">
                                <div class="flex items-center text-xs font-semibold text-slate-600">
                                    <i class="far fa-calendar-alt w-5 text-[#AE1049]"></i>
                                    <span>${act.fecha}</span>
                                </div>
                                <div class="flex items-center text-xs text-slate-500">
                                    <i class="fas fa-map-marker-alt w-5 text-slate-400"></i>
                                    <span>${act.lugar}</span>
                                </div>
                                <div class="flex items-center text-xs text-slate-500">
                                    <i class="fas fa-chalkboard-teacher w-5 text-slate-400"></i>
                                    <span>${act.docente}</span>
                                </div>
                            </div>
                        </div>
                        <div class="px-6 pb-6 mt-auto space-y-2">
                            <button onclick="shareWhatsApp(${act.index})"
                                class="no-print w-full flex items-center justify-center gap-2 py-3 rounded-xl bg-[#25D366] text-white font-bold text-sm shadow-md hover:bg-[#128C7E] transition-all">
                                <i class="fab fa-whatsapp text-lg"></i> CONSULTAR POR WHATSAPP
                            </button>
                            <a href="${act.instagram}" target="_blank"
                                class="no-print w-full flex items-center justify-center gap-2 py-3 rounded-xl bg-gradient-to-r from-[#833ab4] via-[#fd1d1d] to-[#fcb045] text-white font-bold text-sm shadow-md hover:opacity-90 transition-all">
                                <i class="fab fa-instagram text-lg"></i> SEGUIR EN INSTAGRAM
                            </a>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function filterBy(career, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderActivities(career);
        }

        window.onload = () => renderActivities('all');
    </script>
</body>
</html>
